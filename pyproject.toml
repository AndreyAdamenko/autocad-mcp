[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autocad-direct"
version = "0.1.0"
description = "MCP server that drives a running AutoCAD 2026 session through Autodesk's ActiveX/COM API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "JIALE LIU" }]
keywords = ["mcp", "model-context-protocol", "autocad", "cad", "activex", "com", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Manufacturing",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2",
    "pywin32>=306",
    "pillow>=10",
]

[project.scripts]
autocad-direct = "autocad_direct.server:run"

[project.urls]
Homepage = "https://github.com/limuzi013/autocad-direct"
Issues = "https://github.com/limuzi013/autocad-direct/issues"

[tool.setuptools]
packages = ["autocad_direct"]
