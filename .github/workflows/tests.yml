name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    # pywin32 is a hard dependency and the COM surface these tests fake is
    # Windows', so a Linux runner could not even install the package.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: python -m pip install .

      - name: Import the server module
        # The tests only reach acad_core, so nothing else here would notice an
        # incompatible mcp release breaking the server's own entry point --
        # which is exactly how mcp 2.0 slipped past a green build once.
        run: python -c "from autocad_mcp import server; print(len(server.TOOLS), 'tools registered')"

      - name: Run the offline tests
        # The suite fakes the COM surface, so AutoCAD does not have to be
        # installed. What it cannot cover is whether AutoCAD accepts the calls;
        # that is what the live verification in the README is for.
        run: python -m unittest discover -s tests -v

      - name: Check the package builds
        run: |
          python -m pip install build
          python -m build
